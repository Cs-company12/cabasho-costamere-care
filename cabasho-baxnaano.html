<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabasho Rasmi - Baxnaano Hospital</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f4235">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1c2521;
    --paper:#faf7f0;
    --line:#dcd3c2;
    --gold:#b8860b;
    --gold-deep:#8a6508;
    --green:#2f5d4c;
    --green-soft:#e7f0ec;
    --red:#a3402f;
  }
  *{box-sizing:border-box;}

  @keyframes drift{
    0%{ transform: translate(0,0) rotate(0deg); }
    50%{ transform: translate(18px,-24px) rotate(8deg); }
    100%{ transform: translate(0,0) rotate(0deg); }
  }
  @keyframes drift2{
    0%{ transform: translate(0,0) rotate(0deg); }
    50%{ transform: translate(-20px,20px) rotate(-10deg); }
    100%{ transform: translate(0,0) rotate(0deg); }
  }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes cardIn{
    from{ opacity:0; transform: translateY(28px) scale(0.97); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  @keyframes logoPulse{
    0%,100%{ box-shadow: 0 6px 18px -4px rgba(0,0,0,0.45), 0 0 0 0 rgba(255,255,255,0.35); }
    50%{ box-shadow: 0 6px 18px -4px rgba(0,0,0,0.45), 0 0 0 8px rgba(255,255,255,0); }
  }
  @keyframes shimmer{
    0%{ background-position: -200% 0; }
    100%{ background-position: 200% 0; }
  }
  @keyframes ring{
    0%{ transform: rotate(0deg); opacity:.5; }
    100%{ transform: rotate(360deg); opacity:.15; }
  }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 10%, #f4ead2 0%, transparent 45%),
      var(--paper);
    font-family: 'Georgia', 'Amiri', serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px;
    position:relative;
    overflow-x:hidden;
  }
  body::before, body::after{
    content:"";
    position:fixed;
    width:260px; height:260px;
    border-radius:50%;
    filter: blur(10px);
    opacity:.18;
    z-index:0;
    pointer-events:none;
  }
  body::before{
    top:-60px; left:-80px;
    background: radial-gradient(circle, var(--green) 0%, transparent 70%);
    animation: drift 14s ease-in-out infinite;
  }
  body::after{
    bottom:-80px; right:-60px;
    background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
    animation: drift2 16s ease-in-out infinite;
  }
  .card{
    width:100%;
    max-width:420px;
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow: 0 20px 40px -20px rgba(28,37,33,0.25);
    overflow:hidden;
    position:relative;
    z-index:1;
    animation: cardIn .6s cubic-bezier(.2,.8,.2,1) both;
  }
  .header{
    background: linear-gradient(135deg, var(--green) 0%, #1f4235 100%);
    color:#fdf9ee;
    padding:26px 26px 22px;
    position:relative;
    overflow:hidden;
  }
  .header::before{
    content:"";
    position:absolute;
    top:-40px; right:-40px;
    width:150px; height:150px;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:50%;
    animation: ring 30s linear infinite;
  }
  .header .ring2{
    content:"";
    position:absolute;
    top:-70px; right:-70px;
    width:210px; height:210px;
    border:1px dashed rgba(255,255,255,0.06);
    border-radius:50%;
    animation: ring 46s linear infinite reverse;
  }
  .header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:
      linear-gradient(135deg, transparent 49%, #fffdf8 50%) 0 0/16px 16px repeat-x;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }
  .logo-badge{
    width:52px; height:52px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    padding:5px;
    box-shadow: 0 6px 14px -4px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(255,255,255,0.6);
    animation: logoPulse 3s ease-in-out infinite;
  }
  .logo-badge span{
    font-family:'Trebuchet MS', sans-serif;
    font-weight:800;
    font-size:15px;
    color:#241a02;
    letter-spacing:.02em;
  }
  .logo-badge img{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
  }
  .brand-name{
    font-family:'Trebuchet MS', sans-serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:.03em;
    color:#fdf9ee;
    line-height:1.2;
    background: linear-gradient(90deg, #fdf9ee 0%, #e9d9a8 45%, #fdf9ee 90%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 5s linear infinite;
  }
  .brand-tag{
    font-family:'Trebuchet MS', sans-serif;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#cfe3d8;
    margin-top:2px;
  }
  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .eyebrow{
    font-family:'Trebuchet MS', sans-serif;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
    color:#cfe3d8;
    margin:0 0 6px;
  }
  h1{
    margin:0;
    font-size:24px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .sub{
    margin:6px 0 0;
    font-size:13px;
    color:#d8ead9;
    font-family:'Trebuchet MS', sans-serif;
  }
  #installBtn{
    display:none;
    align-items:center;
    gap:6px;
    background:var(--gold);
    color:#241a02;
    border:none;
    border-radius:10px;
    padding:9px 12px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 6px 14px -6px rgba(0,0,0,0.4);
    flex-shrink:0;
  }
  #installBtn:hover{ background:#c8940f; }
  #installBtn svg{ width:14px; height:14px; }

  .body{ padding:24px 26px 28px; }

  label{
    display:block;
    font-family:'Trebuchet MS', sans-serif;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold-deep);
    margin-bottom:8px;
    font-weight:700;
  }
  .field{ margin-bottom:16px; opacity:0; animation: fadeUp .5s ease both; }
  .field:nth-of-type(1){ animation-delay:.05s; }
  .field:nth-of-type(2){ animation-delay:.1s; }
  .field:nth-of-type(3){ animation-delay:.15s; }
  .field:nth-of-type(4){ animation-delay:.2s; }
  .field:nth-of-type(5){ animation-delay:.25s; }
  .input-wrap{
    display:flex;
    align-items:center;
    border:2px solid var(--line);
    border-radius:12px;
    padding:10px 14px;
    background:#fff;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .input-wrap:focus-within{ border-color:var(--gold); box-shadow: 0 0 0 4px rgba(184,134,11,0.12); }
  input[type="text"], input[type="tel"], select, textarea{
    border:none;
    outline:none;
    font-size:16px;
    font-family:'Trebuchet MS', sans-serif;
    width:100%;
    background:transparent;
    color:var(--ink);
  }
  textarea{
    resize:vertical;
    min-height:90px;
    line-height:1.5;
    font-family:Georgia, serif;
    font-size:15px;
  }
  select{
    appearance:none;
    -webkit-appearance:none;
    cursor:pointer;
  }
  .select-wrap{ position:relative; }
  .select-wrap::after{
    content:"▾";
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--gold-deep);
    pointer-events:none;
    font-size:13px;
  }

  .urgency-row{ display:flex; gap:10px; }
  .urgency-btn{
    flex:1;
    padding:11px 6px;
    border-radius:10px;
    border:2px solid var(--line);
    background:#fff;
    font-family:'Trebuchet MS', sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    transition: all .2s ease;
  }
  .urgency-btn:hover{ border-color:var(--gold); transform: translateY(-2px); }
  .urgency-btn.active{
    background: var(--green);
    border-color: var(--green);
    color:#fdf9ee;
    transform: translateY(-1px);
    box-shadow: 0 8px 16px -8px rgba(47,93,76,0.7);
  }
  .urgency-btn.active.high{
    background: var(--red);
    border-color: var(--red);
    box-shadow: 0 8px 16px -8px rgba(163,64,47,0.7);
    animation: logoPulse 1.6s ease-in-out infinite;
  }

  .submit-btn{
    width:100%;
    margin-top:8px;
    padding:15px;
    border:none;
    border-radius:12px;
    background: linear-gradient(135deg, var(--green) 0%, #1f4235 100%);
    color:#fdf9ee;
    font-family:'Trebuchet MS', sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow: 0 12px 24px -12px rgba(47,93,76,0.6);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .submit-btn:hover{ transform: translateY(-2px); box-shadow: 0 16px 28px -12px rgba(47,93,76,0.7); }
  .submit-btn:active{ transform: scale(0.98); }
  .submit-btn svg{ width:18px; height:18px; }

  .error-note{
    color:var(--red);
    font-family:'Trebuchet MS', sans-serif;
    font-size:12px;
    margin-top:6px;
    display:none;
  }

  .installed-note{
    text-align:center;
    margin-top:14px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:11px;
    color:#8a8272;
  }

  .pdf-btn{
    width:100%;
    margin-top:10px;
    padding:15px;
    border:2px solid var(--gold);
    border-radius:12px;
    background:#fff;
    color:var(--gold-deep);
    font-family:'Trebuchet MS', sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition: all .15s ease;
  }
  .pdf-btn:hover{ background:#fbf3e3; transform: translateY(-2px); box-shadow: 0 10px 20px -12px rgba(184,134,11,0.5); }
  .pdf-btn:active{ transform: scale(0.98); }
  .pdf-btn svg{ width:18px; height:18px; }
  .pdf-btn.loading svg{ animation: spin .8s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>

  const noteInput = document.getElementById('fnote');
  const errNote = document.getElementById('errNote');
  const sendBtn = document.getElementById('sendBtn');
  const installBtn = document.getElementById('installBtn');
  const installedNote = document.getElementById('installedNote');

  sendBtn.addEventListener('click', () => {
    const note = noteInput.value.trim();

    if (!note){
      errNote.style.display = 'block';
      noteInput.focus();
      return;
    }
    errNote.style.display = 'none';

    const today = new Date().toLocaleDateString('so-SO', { year: 'numeric', month: 'long', day: 'numeric' });

    let msg = `*CABASHO RASMI AH - BAXNAANO HOSPITAL*\n\n`;
    msg += `Taariikh: ${today}\n\n`;
    msg += `Faahfaahinta cabashada:\n${note}\n\n`;
    msg += `— Waxaan rajaynayaa in cabashadan si degdeg ah loo eego. Mahadsanid.`;

    const url = `https://wa.me/${CARE_WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  });

  // ---- PDF generation (jsPDF) ----
  const pdfBtn = document.getElementById('pdfBtn');

  pdfBtn.addEventListener('click', () => {
    const note = noteInput.value.trim();

    if (!note){
      errNote.style.display = 'block';
      noteInput.focus();
      return;
    }
    errNote.style.display = 'none';

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 54;

    const green = [47, 93, 76];
    const greenDark = [31, 66, 53];
    const gold = [184, 134, 11];
    const goldLight = [230, 197, 122];
    const ink = [28, 37, 33];
    const grey = [130, 122, 108];
    const line = [220, 211, 194];
    const paper = [250, 247, 240];

    // Full page backdrop
    doc.setFillColor(...paper);
    doc.rect(0, 0, pageW, pageH, 'F');

    // Decorative corner rings (top-right, bottom-left)
    doc.setDrawColor(...goldLight);
    doc.setLineWidth(1);
    for (let r = 40; r <= 160; r += 40){
      doc.circle(pageW + 10, -10, r, 'S');
      doc.circle(-10, pageH + 10, r, 'S');
    }

    // Outer ornamental border
    doc.setDrawColor(...gold);
    doc.setLineWidth(1.2);
    doc.rect(20, 20, pageW - 40, pageH - 40, 'S');
    doc.setDrawColor(...green);
    doc.setLineWidth(0.5);
    doc.rect(25, 25, pageW - 50, pageH - 50, 'S');

    // Header band
    doc.setFillColor(...greenDark);
    doc.rect(20, 20, pageW - 40, 118, 'F');
    doc.setFillColor(...gold);
    doc.rect(20, 134, pageW - 40, 4, 'F');

    // Logo badge (real hospital logo)
    const logoR = 28;
    const logoCX = pageW - margin - logoR + 6;
    const logoCY = 79;
    doc.setFillColor(255, 253, 248);
    doc.circle(logoCX, logoCY, logoR, 'F');
    doc.setDrawColor(...gold);
    doc.setLineWidth(1.5);
    doc.circle(logoCX, logoCY, logoR, 'S');
    try {
      doc.addImage(HOSPITAL_LOGO_B64, 'PNG', logoCX - logoR + 5, logoCY - logoR + 5, (logoR - 5) * 2, (logoR - 5) * 2);
    } catch (e) { /* logo optional */ }

    doc.setTextColor(255, 253, 248);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(22);
    doc.text('Baxnaano Hospital', margin, 68);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.setTextColor(207, 227, 216);
    doc.text('Cabasho Rasmi ah  ·  Warqad Rasmi', margin, 90);

    const today = new Date().toLocaleDateString('so-SO', { year: 'numeric', month: 'long', day: 'numeric' });
    doc.setFontSize(10);
    doc.text('Taariikh: ' + today, margin, 110);

    let y = 190;

    // Decorative small flourish above the title
    doc.setDrawColor(...gold);
    doc.setLineWidth(1);
    doc.line(margin, y, margin + 40, y);
    doc.setFillColor(...gold);
    doc.circle(margin + 46, y, 2.2, 'F');
    doc.line(margin + 52, y, pageW - margin, y);

    y += 26;
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(13);
    doc.setTextColor(...gold);
    doc.text('FAAHFAAHINTA CABASHADA', margin, y);
    y += 24;

    doc.setFont('times', 'normal');
    doc.setFontSize(13);
    doc.setTextColor(...ink);
    const noteLines = doc.splitTextToSize(note, pageW - margin * 2);
    doc.text(noteLines, margin, y, { lineHeightFactor: 1.6 });
    y += noteLines.length * 13 * 1.6 + 28;

    // Closing flourish
    doc.setDrawColor(...gold);
    doc.setLineWidth(1);
    doc.line(margin, y, pageW - margin, y);
    y += 24;

    doc.setFont('helvetica', 'italic');
    doc.setFontSize(11.5);
    doc.setTextColor(...grey);
    doc.text('Waxaan rajaynayaa in cabashadan si degdeg ah loo eego. Mahadsanid.', margin, y);
    y += 46;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10.5);
    doc.setTextColor(...ink);
    doc.text('Saxiixa: _______________________', margin, y);
    doc.text('Taariikhda: __________________', pageW - margin - 150, y);

    // Footer seal
    doc.setDrawColor(...line);
    doc.setLineWidth(0.75);
    doc.line(margin, pageH - 74, pageW - margin, pageH - 74);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(...grey);
    doc.text('Baxnaano Hospital — Cabasho Rasmi ah', margin, pageH - 54);
    doc.text('La soo saaray si otomaatig ah', margin, pageH - 40);

    const fileDate = new Date().toISOString().slice(0, 10);
    doc.save(`Cabasho-Baxnaano-${fileDate}.pdf`);
  });

  // ---- PWA: install prompt ----
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-flex';
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted'){
      installBtn.style.display = 'none';
    }
    deferredPrompt = null;
  });

  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
    installedNote.style.display = 'block';
  });

  // ---- Service worker registration ----
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.log('SW registration failed:', err);
      });
    });
  }
